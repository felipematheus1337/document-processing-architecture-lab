server:
  port: 8082

spring:
  application:
    name: processing-service

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://mongo:mongo@localhost:27017/processingdb?authSource=admin}

  cloud:
    function:
      definition: processDocumentSubmitted
    stream:
      bindings:
        processDocumentSubmitted-in-0:
          destination: document-submitted
          group: processing-service
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always