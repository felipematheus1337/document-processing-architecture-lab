server:
  port: 8082

spring:
  application:
    name: processing-service

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://mongo:mongo@localhost:27017/processingdb?authSource=admin}

  cloud:
    function:
      definition: processDocumentSubmitted
    stream:
      bindings:
        processDocumentSubmitted-in-0:
          destination: document-submitted
          group: processing-service
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    otlp:
      tracing:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level service=${spring.application.name} traceId=%X{traceId} spanId=%X{spanId} correlationId=%X{correlationId} documentId=%X{documentId} processingEventId=%X{processingEventId} thread=%thread logger=%logger{36} msg=\"%msg\"%n"